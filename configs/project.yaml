# Experiment configuration defaults - single source of truth
# These are the canonical example settings from design.md section 18.
# They are starting defaults, NOT empirically established optima.

project:
  name: predictive-container-management
  phase: 1

sla:
  p95_latency_ms: 250
  safety_margin_ms: 20

containers:
  min: 2
  max: 30
  max_change_per_cycle: 5

forecast:
  history_window: 30
  horizon: 5
  # Compact TFT (pure PyTorch) - defaults from design.md section 6.
  model:
    d_model: 32            # hidden width of the TFT backbone
    attention_heads: 2
    dropout: 0.1
    variable_selection: true
  training:
    epochs: 8
    batch_size: 64
    learning_rate: 0.001
    # Chronological split fractions (train < validation < test). No shuffle.
    split: [0.70, 0.15, 0.15]
    seed: 42
  # Target column to forecast; normalized with a train-fit scaler.
  target_column: invocation_count
  # Extra covariates fed to the forecaster alongside the target.
  covariates: [cpu_utilization, memory_utilization, active_containers, hour, day_of_week, peak_period]
  checkpoint_path: models/tft_checkpoint.pt
  evaluation:
    output_dir: results/forecast
    peak_quantile: 0.9
    interval_alpha: 0.2
    seasonal_period: 1440
    moving_average_window: 5
    max_plot_points: 800
  inference:
    max_staleness_s: 300

control:
  interval_seconds: 60
  # PPO (pure PyTorch) - defaults from design.md sections 10-12.
  rl:
    # Discrete action set: 0 NoOp, 1 PreWarm, 2 ScaleOut, 3 Reuse, 4 ScaleIn, 5 Terminate.
    n_actions: 6
    # Reward weights (design.md section 12). Normalized components.
    reward_weights:
      energy: 1.0        # w_e
      latency: 1.0       # w_l
      cold_start: 1.5    # w_c
      resource: 0.5      # w_r
      underutil: 0.3     # w_u
      sla_violation: 5.0 # w_s (highest penalty - SLA is the primary constraint)
    training:
      episodes: 200
      gamma: 0.99
      gae_lambda: 0.95
      clip_ratio: 0.2
      learning_rate: 0.0003
      epochs_per_update: 4
      minibatch_size: 64
      entropy_coeff: 0.01
      seed: 42
    # Simulation constants for the serverless environment.
    sim:
      containers_per_100_rps: 2   # target load per container
      base_latency_ms: 40
      ms_per_extra_container: 8   # latency penalty per container of shortfall
      power_per_container_w: 15
      idle_power_w: 5
      lifecycle_delay_steps: 1   # simulated steps before PreWarm containers become reusable
      cooldown_steps: 0          # optional guard against rapid scale reductions
      cold_history_steps: 10     # recent cold-start history exposed to PPO observation
    checkpoint_path: models/ppo_policy.pt

agent:
  # Planner runtime: "stub" (deterministic, offline; default) or "ollama"
  # (real Qwen3 over the local Ollama HTTP API). Qwen3 is a high-level planner
  # only - it never emits infrastructure commands.
  runtime: stub
  model: qwen3:4b
  base_url: http://localhost:11434
  timeout_s: 30
  temperature: 0.0
  num_predict: 256
  prompt_version: planner-v2
  max_prompt_chars: 8000
  max_metadata_keys: 12
  max_metadata_chars: 200
  # Deterministic thresholds used by the offline stub planner.
  high_demand_ratio: 1.10   # forecast peak / current workload => scale out
  low_demand_ratio: 0.90    # forecast peak / current workload => scale in (if safe)

execution:
  # Layer 10 (Kubernetes/OpenFaaS/Docker). Disabled by default for safety.
  enabled: false
  dry_run: true
  allow_live: false
  backend: kubernetes
  namespace: serverless-mgmt
  function: fn-checkout
  kubectl: kubectl
  timeout_s: 30
  allowed_namespaces: [serverless-mgmt, openfaas-fn]
  max_replicas: 30
  openfaas_namespace: openfaas-fn
  audit_enabled: true
  audit_path: results/execution/audit.jsonl
  docker:
    binary: docker
    service: fn-checkout
    allowed_services: [fn-checkout]

monitoring:
  enabled: false
  prometheus:
    host: 127.0.0.1
    port: 9090
    scrape_interval_s: 15
    exporter_port: 8000
    adapter_enabled: false
    timeout_s: 5
    queries:
      p95_latency_ms: 'histogram_quantile(0.95, sum(rate(fn_latency_ms_bucket[5m])) by (le))'
      current_workload: 'sum(rate(fn_invocations_total[5m])) * 60'
      cold_starts: 'sum(increase(fn_cold_starts_total[5m]))'
      energy_w: 'sum(fn_energy_w)'
      active_containers: 'sum(kube_deployment_status_replicas{deployment="fn-checkout"})'
  grafana:
    host: 127.0.0.1
    port: 3000
    dashboard_uid: control-loop
  alerts:
    enabled: true
    log_enabled: true
    log_path: results/monitoring/alerts.jsonl
    rules:
      sla_violation_rate:
        enabled: true
        severity: critical
        threshold: 0.1
  metrics:
    export_interval_s: 60
    history_size: 1000
  feedback:
    enabled: true
    window: 10        # number of recent steps used by feedback
    degrade_threshold: 0.2  # relative increase in p95/violations to trigger caution
    min_samples: 5
    record_enabled: true
    record_path: results/monitoring/feedback.jsonl
    source: simulated


baseline:
  # Reactive autoscaler (agreed step 2) used as the comparison baseline.
  scale_up_threshold: 0.7    # scale out when mean cpu above this
  scale_down_threshold: 0.3  # scale in when mean cpu below this
  target_cpu: 0.6

data:
  # Workload trace source (Azure is data source only, not execution platform).
  # source: sample | file | azure_functions_2019
  # - sample: built-in synthetic demo trace (default, CI-friendly)
  # - file: read a prepared CSV at source_path
  # - azure_functions_2019: read a prepared Azure Functions 2019 invocations CSV (see data.azure_functions_2019)
  source: sample
  source_path: data/raw/azure_functions_trace.csv
  processed_path: data/processed/features.csv
  dedupe_policy: last            # first | last | mean
  target_column: invocation_count
  normalize: false               # scaler is fit on the train split only (P2)
  azure:
    # Official selected trace: AzureFunctionsDataset2019 (ATC 2020, CC-BY-4.0)
    # Raw archive is NOT committed/downloaded by default. Use inspect/download/verify/prepare steps.
    dataset: azurefunctions-dataset-2019
    raw_dir: data/raw/azure/azurefunctions-dataset-2019
    extracted_dir: data/raw/azure/azurefunctions-dataset-2019/extracted
    processed_path: data/processed/azure_features.csv
    manifest_path: data/processed/azure_manifest.json
    invocations_glob: invocations_per_function_md.anon.d*.csv
    function_limit: null         # optional: limit number of functions for experiments
    simulate_resources: false    # if true, add deterministic SIMULATED/ESTIMATED resource proxies (not in trace)
    aggregate: total
    top_k: null
    chunk_size: 2000
    timeout_s: 300

features:
  lags: [1, 2, 3]
  rolling_windows: [5, 10, 30]
  rolling_stats: [mean, max, min, std]
  peak_hours: [9, 10, 11, 12, 13, 14, 15, 16, 17]

evaluation:
  repetitions: 5
  baseline: reactive
  seeds: [42, 43, 44]

decision_log:
  enabled: true
  path: results/decision/decisions.jsonl
  replay_dir: results/decision/replay

decision_engine:
  forecast_source: persistence
  ablations: [full, planner_off, policy_off, feedback_off, forecast_off]
