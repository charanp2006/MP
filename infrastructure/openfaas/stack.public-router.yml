version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  fn-checkout:
    image: docker.io/library/nginx:alpine
    fprocess: nginx -g "daemon off;"
    environment:
      SERVICE_PORT: "8080"
      FUNCTION_NAME: "fn-checkout"
      WARM_REPLICAS: "2"
      ENERGY_PER_MB: "0.002"
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "8080"
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
