apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: serverless-mgmt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-scale
  namespace: serverless-mgmt
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["fn-checkout"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-scale
  namespace: serverless-mgmt
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: serverless-mgmt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-scale
