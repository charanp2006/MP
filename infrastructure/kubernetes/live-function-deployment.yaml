apiVersion: apps/v1
kind: Deployment
metadata:
  name: fn-checkout
  namespace: openfaas-fn
  labels:
    app: fn-checkout
    faasFunction: fn-checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fn-checkout
      faasFunction: fn-checkout
  template:
    metadata:
      labels:
        app: fn-checkout
        faasFunction: fn-checkout
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fn-checkout
          image: fn-checkout-live:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: FUNCTION_NAME
              value: "fn-checkout"
            - name: WARM_REPLICAS
              value: "2"
            - name: ENERGY_PER_MB
              value: "0.002"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
