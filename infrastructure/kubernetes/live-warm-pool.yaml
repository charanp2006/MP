apiVersion: apps/v1
kind: Deployment
metadata:
  name: fn-checkout-warm
  namespace: serverless-mgmt
  labels:
    app: fn-checkout-warm
    app.kubernetes.io/part-of: predictive-serverless
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fn-checkout-warm
  template:
    metadata:
      labels:
        app: fn-checkout-warm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fn-checkout-warm
          image: fn-checkout-live:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: FUNCTION_NAME
              value: "fn-checkout"
            - name: WARM_REPLICAS
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
