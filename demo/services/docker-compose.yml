services:
  fn_checkout:
    build: .
    image: m9-sample-service:latest
    environment:
      SERVICE_NAME: fn_checkout
      FUNCTION_NAME: fn-checkout
      SERVICE_PORT: "8080"
      SERVICE_VERSION: "1.0.0"
      ACTIVE_CONTAINERS: "1"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  fn_search:
